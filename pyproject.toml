[project]
name = "labkit"
version = "0.1.0"
description = "A modular CLI and TUI toolkit for managing your homelab - SSH, RCON and network tools in one place."
readme = "README.md"
authors = [
    { name = "TobiMax1212", email = "102673652+TobiMax1212@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "rich>=15.0.0",
    "typer>=0.27.3",
]

license = "MIT"
license-files = ["LICENSE"]
keywords = ["homelab", "cli", "tui", "ssh", "rcon", "network"]

[project.urls]
Repository = "https://github.com/TobiMax1212/Labkit"
Issues = "https://github.com/TobiMax1212/Labkit/issues"

[project.scripts]
labkit = "labkit:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
